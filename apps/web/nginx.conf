server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;  # JSON endpoints; the upload location below lifts it

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Raw-body uploads stream straight through to the API (no nginx temp files in a read-only
    # container); the API enforces FILECANOPY_MAX_UPLOAD_BYTES while reading.
    location ~ ^/api/v1/nodes/[0-9a-fA-F-]+/files$ {
        resolver 127.0.0.11 valid=5s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_buffering off;  # downloads stream from the API; no nginx temp files
        resolver 127.0.0.11 valid=5s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
