server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;  # JSON endpoints; the upload location below lifts it

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Same-origin app only: no inline scripts or styles, no framing, no third-party requests.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Raw-body uploads stream straight through to the API (no nginx temp files in a read-only
    # container); the API enforces FILECANOPY_MAX_UPLOAD_BYTES while reading.
    location ~ ^/api/v1/nodes/[0-9a-fA-F-]+/files$ {
        resolver 127.0.0.11 valid=5s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_buffering off;  # downloads stream from the API; no nginx temp files
        resolver 127.0.0.11 valid=5s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # Single-page app: unknown paths (e.g. /f/<id>) get the shell; it must always be revalidated.
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
