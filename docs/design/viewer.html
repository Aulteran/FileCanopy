<!DOCTYPE html>
<html lang="en"><head>
<!-- REFERENCE ONLY, not shipped. This mockup loads its fonts from Google Fonts, which is an external request. The app itself never does: it self-hosts the fonts (apps/web/src/fonts). Open this file offline and it falls back to system fonts. --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileCanopy viewer mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap">
<style>
:root{--bg:#f5f7f2;--surface:#fff;--sunken:#ebefe7;--line:#d3dbcf;--text:#1c2a22;--muted:#55665b;--primary:#2f6b4f;--on-primary:#fff;--sel:#e1eedd;--sun:#f2b94b;--warning:#8a5300;--info:#23629e;--confidential:#9b2c4a;--focus:#1f6fd6;--stage:#dfe5db;--shadow:0 1px 2px rgb(20 40 28/.06),0 6px 20px rgb(20 40 28/.08);--fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--fb:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
.dark{--bg:#111713;--surface:#18201b;--sunken:#1f2923;--line:#2f3b33;--text:#e4ece5;--muted:#a3b2a7;--primary:#7cc59a;--on-primary:#0d1a12;--sel:#24382c;--sun:#f5c56a;--warning:#f0b45a;--info:#7fb3ec;--confidential:#f08aa5;--focus:#8ab8ff;--stage:#0c110e;--shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.35)}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 var(--fb);background:#e9ede6;color:#1c2a22}
header.top{padding:20px 24px 8px}h1{font:700 24px var(--fd);margin:0}p.sub{margin:4px 0 0;color:#55665b;max-width:70ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px}.tabs button{font:inherit;border:1px solid #d3dbcf;background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:#1c2a22}.tabs button[aria-selected=true]{background:#2f6b4f;color:#fff;border-color:#2f6b4f}
.notes{margin:0 24px 12px;padding:12px 16px;background:#fff;border:1px solid #d3dbcf;border-radius:10px;max-width:900px;font-size:15px}.notes b{font-family:var(--fd)}.notes ul{margin:6px 0 0;padding-left:20px}
.scene{display:none;padding:0 24px 32px}.scene.on{display:block}
.frame{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;max-width:1100px;height:640px;font-family:var(--fb)}
.frame.phone{width:360px;height:700px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .name{font:700 16px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.bar .meta{color:var(--muted);font-size:13px;white-space:nowrap}
.sp{flex:1}.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-height:36px;cursor:pointer}
.btn.p{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.btn.q{border-color:transparent;background:transparent}.btn.ic{padding:6px;width:36px;justify-content:center}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.banner{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--sel);border-bottom:1px solid var(--line);font-size:14px}.banner svg{color:var(--primary)}
.body{flex:1;display:flex;min-height:0}.thumbs{width:110px;background:var(--surface);border-right:1px solid var(--line);padding:12px;overflow:hidden;display:flex;flex-direction:column;gap:10px;align-items:center}
.th{width:70px;height:92px;background:#fff;border:2px solid var(--line);border-radius:4px;position:relative}.th.cur{border-color:var(--primary)}.th span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.stage{flex:1;background:var(--stage);overflow:hidden;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.page{background:#fff;color:#222;width:min(480px,100%);min-height:560px;box-shadow:0 2px 10px rgb(0 0 0/.25);padding:44px 48px;border-radius:2px;font:13px/1.55 Georgia,serif;flex:none}
.page h4{font:700 18px Georgia,serif;margin:0 0 14px}.ln{height:7px;background:#d9dcd6;border-radius:3px;margin:9px 0}.ln.s{width:70%}.ln.m{width:88%}
.tb{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-top:1px solid var(--line);justify-content:center;flex-wrap:wrap}.tb .pg{font-size:14px;color:var(--muted)}.tb input{width:44px;font:inherit;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);padding:3px}
.state{flex:1;display:grid;place-items:center;padding:24px;background:var(--stage)}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:420px;text-align:center;box-shadow:var(--shadow)}.card h2{font:700 20px var(--fd);margin:10px 0 4px}.card p{margin:0 0 16px;color:var(--muted)}.ring{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--sel);color:var(--primary)}.ring.c{background:rgb(155 44 74/.12);color:var(--confidential)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hist{font-size:13px;color:var(--muted);padding:6px 14px;background:var(--surface);border-top:1px solid var(--line)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol><symbol id="dl" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol><symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol><symbol id="up" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></symbol><symbol id="down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol><symbol id="file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></symbol><symbol id="sheet" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></symbol><symbol id="panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol></defs></svg>

<header class="top"><h1>FileCanopy viewer: design mockup</h1><p class="sub">What happens when you click a file. Design only, nothing is built yet. It uses the approved colours, fonts and rounded style. Pick a scene below.</p></header>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="scenes"></div>

<script>
const I=n=>`<svg class="i" aria-hidden="true"><use href="#${n}"/></svg>`;
const lines=(n)=>Array.from({length:n},(_,k)=>`<div class="ln ${k%5==4?'s':k%3==2?'m':''}"></div>`).join('');
const pdfPage=(t)=>`<div class="page">${t?`<h4>${t}</h4>`:''}${lines(t?16:22)}</div>`;
const bar=(name,meta,extra='')=>`<div class="bar"><button class="btn ic q" aria-label="Back to Taxes">${I('back')}</button><span class="name">${name}</span><span class="meta">${meta}</span><span class="sp"></span>${extra}<button class="btn ic q" aria-label="Details">${I('info')}</button><button class="btn">${I('dl')}Download</button></div>`;
const tools=(pg,zoom)=>`<div class="tb"><button class="btn ic" aria-label="Previous page">${I('up')}</button><span class="pg">Page <input value="${pg}" aria-label="Page number"> of 12</span><button class="btn ic" aria-label="Next page">${I('down')}</button><span style="width:16px"></span><button class="btn ic" aria-label="Zoom out">${I('minus')}</button><span class="pg">${zoom}</span><button class="btn ic" aria-label="Zoom in">${I('plus')}</button><button class="btn ic" aria-label="Fit to width">${I('fit')}</button></div>`;
const scenes=[
{id:'pdf',t:'PDF · light',cls:'',html:`<div class="frame">${bar('Tax return 2025.pdf','PDF · 12 pages · 1.2 MB')}<div class="body"><div class="thumbs" aria-label="Pages"><div class="th cur"><span>1</span></div><div class="th" style="margin-top:8px"><span>2</span></div><div class="th" style="margin-top:8px"><span>3</span></div><div class="th" style="margin-top:8px"><span>4</span></div></div><div class="stage">${pdfPage('Tax return 2025')}${pdfPage('')}</div></div>${tools(1,'100%')}</div>`,
 n:['Opens when you click the file. Scroll to read, like any PDF.','Page strip on the left (hidden on phones), page box, zoom, fit to width.','Back returns to the same folder and position. Download is always one tap away.','Selecting and copying text works; links to other websites ask first.']},
{id:'word',t:'Word document · dark',cls:'dark',html:`<div class="frame dark" style="background:var(--bg)">${bar('Lease agreement.docx','Word · 8 pages · 96 KB')}<div class="banner">${I('info')}<span>Preview made for reading. Layout can differ a little from Word. <b>Download</b> for the exact original.</span></div><div class="body"><div class="stage">${pdfPage('Lease agreement')}${pdfPage('')}</div></div>${tools(1,'100%')}</div>`,
 n:['Word, Excel and PowerPoint files are turned into a read-only PDF in a sealed helper (M10), then shown in this same viewer.','A short banner says it is a preview. Nothing in the document can run.','Dark theme follows your device, same as the rest of the app.']},
{id:'phone',t:'Phone',cls:'',html:`<div class="frame phone"><div class="bar" style="padding:8px 8px"><button class="btn ic q" aria-label="Back">${I('back')}</button><span class="name">Tax return 2025.pdf</span><span class="sp"></span><button class="btn ic" aria-label="Download">${I('dl')}</button></div><div class="stage" style="padding:12px">${pdfPage('Tax return 2025')}${pdfPage('')}</div><div class="tb" style="gap:4px"><button class="btn ic" aria-label="Previous">${I('up')}</button><span class="pg">1 / 12</span><button class="btn ic" aria-label="Next">${I('down')}</button><span class="sp"></span><button class="btn ic" aria-label="Zoom out">${I('minus')}</button><button class="btn ic" aria-label="Zoom in">${I('plus')}</button><button class="btn ic" aria-label="Details">${I('info')}</button></div></div>`,
 n:['One bar, large tap targets, pinch to zoom.','Page strip is replaced by the page counter.','Details (who changed it, history) opens as a sheet, as in the approved phone design.']},
{id:'nope',t:'Can’t preview',cls:'',html:`<div class="frame">${bar('Holiday video.mkv','Video · 1.4 GB')}<div class="state"><div class="card"><span class="ring">${I('file')}</span><h2>No preview for this kind of file</h2><p>FileCanopy can show PDFs, pictures, text and Office documents. This one you can still download and open on your device.</p><div class="row"><button class="btn p">${I('dl')}Download</button><button class="btn">Back to folder</button></div></div></div></div>`,
 n:['Any file the viewer can’t show gets a friendly page with Download, never a blank screen.','Same page when a document is too big or damaged, with the reason in plain words.','Video and audio playback comes later.']},
{id:'lock',t:'Locked folder',cls:'',html:`<div class="frame">${bar('Medical letter.pdf','Confidential')}<div class="state"><div class="card"><span class="ring c">${I('lock')}</span><h2>This file is locked</h2><p>It sits in a Confidential folder. Enter your password to open it. The lock closes again after 5 minutes without activity.</p><div class="row"><button class="btn p">Unlock</button><button class="btn">Back to folder</button></div></div></div></div>`,
 n:['If the five-minute lock closes while you read, the page is covered at once and nothing stays on screen behind it.','Administrators cannot open other people’s personal files in the viewer either.']}
];
const tabs=document.getElementById('tabs'),root=document.getElementById('scenes');
scenes.forEach((s,k)=>{const b=document.createElement('button');b.textContent=s.t;b.setAttribute('role','tab');b.onclick=()=>show(k);tabs.appendChild(b);
 const d=document.createElement('section');d.className='scene';d.innerHTML=`<div class="notes"><b>What to notice</b><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul></div>${s.html}`;root.appendChild(d)});
function show(k){[...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected',j==k));[...root.children].forEach((d,j)=>d.classList.toggle('on',j==k))}
show(0);
</script></body></html>
