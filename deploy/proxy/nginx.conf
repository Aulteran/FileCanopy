# Plain nginx in front of FileCanopy (Nginx Proxy Manager is nginx too; see README.md for NPM).
# Put this in /etc/nginx/conf.d/filecanopy.conf. The certificate paths are examples (certbot).
# "web" is the FileCanopy web container: nginx must share a Docker network with it
# (docker-compose.proxy.yml). If nginx runs on the host instead, use http://127.0.0.1:8080.
server {
    listen 80;
    server_name files.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.example.org;
    ssl_certificate     /etc/letsencrypt/live/files.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.org/privkey.pem;

    include /etc/nginx/filecanopy-advanced.conf;  # a copy of npm-advanced.conf

    location / {
        # Looked up again after the web container is recreated.
        resolver 127.0.0.11 valid=5s;
        set $filecanopy http://web:8080;
        proxy_pass $filecanopy;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
