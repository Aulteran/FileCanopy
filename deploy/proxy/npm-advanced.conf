# Nginx Proxy Manager: paste into the proxy host's "Advanced" tab ("Custom Nginx Configuration").
# These directives sit at server level, so they apply to everything NPM proxies for this host.
#
# Uploads are one raw streamed request (up to FILECANOPY_MAX_UPLOAD_BYTES, 10 GiB by default).
# Without these lines nginx would refuse bodies over 1 MB or buffer the whole file on disk first.
client_max_body_size 0;
proxy_request_buffering off;
proxy_buffering off;
# Large uploads and downloads take a long time; do not cut them off.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
send_timeout 3600s;

# NPM's built-in config believes an X-Real-IP header sent by any home-network or Docker address
# (10/8, 172.16/12, 192.168/16) and passes it on as the visitor's address. Any device on your
# network could then pick the address FileCanopy records. This line replaces that list for this
# host so only the real peer address counts. If Cloudflare is in front of NPM, add its ranges
# back here as more `set_real_ip_from` lines.
set_real_ip_from 127.0.0.1/32;
