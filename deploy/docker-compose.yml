# Core stack:      docker compose up -d --build
# With workers:    docker compose --profile workers up -d --build
# No AI service exists in this file; AI is optional and arrives in later milestones.
name: filecanopy

x-api-env: &api-env
  FILECANOPY_DATABASE_URL: postgresql+psycopg://filecanopy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/filecanopy
  FILECANOPY_LIBRARY_PATH: /library
  FILECANOPY_APP_DATA_PATH: /app-data

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: filecanopy
      POSTGRES_USER: filecanopy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filecanopy -d filecanopy"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot, serialized by a Postgres advisory lock. Re-running is a no-op.
  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile, target: runtime }
    image: filecanopy-api:dev
    command: ["python", "-m", "app.db.migrate"]
    restart: "no"
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    <<: *hardening

  api:
    image: filecanopy-api:dev
    restart: unless-stopped
    user: "${FILECANOPY_UID:-10001}:${FILECANOPY_GID:-10001}"
    environment:
      <<: *api-env
      # Optional tier. Empty = not configured. Set to redis://redis:6379/0 when using the
      # `workers` profile so health can report worker status.
      FILECANOPY_REDIS_URL: ${FILECANOPY_REDIS_URL:-}
      # Authentication. The bundled nginx replaces X-Forwarded-For with the real client address
      # (it believes the header only from FILECANOPY_TRUSTED_PROXIES, see the web service), so
      # exactly one hop is trusted here. Do not change this; configure trusted proxies instead.
      FILECANOPY_TRUSTED_PROXY_HOPS: "1"
      # Behind a reverse proxy: the address people type in the browser (https://files.example.org).
      # ALLOWED_ORIGINS adds more, comma-separated. See deploy/proxy/README.md.
      FILECANOPY_PUBLIC_URL: ${FILECANOPY_PUBLIC_URL:-}
      FILECANOPY_ALLOWED_ORIGINS: ${FILECANOPY_ALLOWED_ORIGINS:-}
      FILECANOPY_COOKIE_SECURE: ${FILECANOPY_COOKIE_SECURE:-true}
      FILECANOPY_SETUP_TOKEN: ${FILECANOPY_SETUP_TOKEN:-}
      # File operations (M04): upload size cap in bytes (default 10 GiB).
      FILECANOPY_MAX_UPLOAD_BYTES: ${FILECANOPY_MAX_UPLOAD_BYTES:-10737418240}
      # Setup import and folder upload (M06b): per-batch limits, ADR-011 section 5.
      FILECANOPY_MAX_IMPORT_ENTRIES: ${FILECANOPY_MAX_IMPORT_ENTRIES:-100000}
      FILECANOPY_MAX_ZIP_BYTES: ${FILECANOPY_MAX_ZIP_BYTES:-10737418240}
      FILECANOPY_MAX_ZIP_UNCOMPRESSED_BYTES: ${FILECANOPY_MAX_ZIP_UNCOMPRESSED_BYTES:-53687091200}
      FILECANOPY_IMPORT_ENTRY_RETENTION_DAYS: ${FILECANOPY_IMPORT_ENTRY_RETENTION_DAYS:-90}
      FILECANOPY_MAX_OPEN_FOLDER_UPLOADS: ${FILECANOPY_MAX_OPEN_FOLDER_UPLOADS:-5}
      FILECANOPY_SCAN_PAUSE_CEILING_SECONDS: ${FILECANOPY_SCAN_PAUSE_CEILING_SECONDS:-1800}
      # Office previews (M10): leave empty to keep them off. To turn them on, start the
      # `converter` profile (COMPOSE_PROFILES=converter) and set this to
      # unix:///run/converter/converter.sock (the socket in the volume shared with the converter).
      FILECANOPY_CONVERTER_URL: ${FILECANOPY_CONVERTER_URL:-}
      # Search (M11): text of your files is indexed in the background for full-text search. Set to
      # false to keep only filename search. OCR (scanned PDFs and pictures) needs the `ocr` profile
      # (COMPOSE_PROFILES=ocr) and this set to unix:///run/ocr/ocr.sock.
      FILECANOPY_SEARCH_ENABLED: ${FILECANOPY_SEARCH_ENABLED:-true}
      FILECANOPY_OCR_URL: ${FILECANOPY_OCR_URL:-}
    volumes:
      - ${FILECANOPY_LIBRARY_PATH:-../library}:/library
      - ${FILECANOPY_APP_DATA_PATH:-../app-data}:/app-data
      - converter-socket:/run/converter
      - ocr-socket:/run/ocr
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    <<: *hardening

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    image: filecanopy-web:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FILECANOPY_HTTP_PORT:-8080}:8080"
    environment:
      # Reverse proxies in front of this container whose X-Forwarded-For / -Proto are believed
      # (IPs or CIDRs, comma-separated). Empty = trust nobody. See deploy/proxy/README.md.
      FILECANOPY_TRUSTED_PROXIES: ${FILECANOPY_TRUSTED_PROXIES:-}
      # true = send Strict-Transport-Security on requests a trusted proxy says were https.
      FILECANOPY_HSTS: ${FILECANOPY_HSTS:-false}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    <<: *hardening

  # Optional sealed Office-to-PDF converter (M10, ADR-019 section 5, converter/README.md).
  # Off unless the `converter` profile is started. Sealed by: NO network at all (it listens on a
  # Unix socket in a volume that only the API shares, so it cannot reach the internet, the API's
  # HTTP port, the database or Docker's DNS), no access to the library, app data or secrets,
  # read-only root with a small non-executable tmpfs, non-root user, all capabilities dropped, no
  # privilege escalation, and memory/CPU/process limits.
  converter:
    build: { context: ../converter }
    image: filecanopy-converter:dev
    profiles: [converter]
    restart: unless-stopped
    network_mode: none
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777,noexec,nosuid,nodev
    volumes:
      - converter-socket:/run/converter
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    environment:
      CONVERTER_TIMEOUT_SECONDS: ${FILECANOPY_CONVERTER_TIMEOUT_SECONDS:-60}
      CONVERTER_MAX_BYTES: ${FILECANOPY_PREVIEW_OFFICE_MAX_BYTES:-52428800}

  # Optional sealed OCR container (M11, ocr/README.md): Tesseract for scanned PDFs and pictures.
  # Off unless the `ocr` profile is started. Sealed exactly like the converter: no network (Unix
  # socket in a volume only the API shares), no library, app data or secrets, read-only root with
  # a small non-executable tmpfs, non-root user, no capabilities, no privilege escalation, limits.
  ocr:
    build: { context: ../ocr }
    image: filecanopy-ocr:dev
    profiles: [ocr]
    restart: unless-stopped
    network_mode: none
    user: "10003:10003"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    volumes:
      - ocr-socket:/run/ocr
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    pids_limit: 128
    environment:
      OCR_TIMEOUT_SECONDS: ${FILECANOPY_OCR_TIMEOUT_SECONDS:-120}
      OCR_MAX_BYTES: ${FILECANOPY_OCR_MAX_BYTES:-52428800}

  redis:
    image: redis:7-alpine
    profiles: [workers]
    restart: unless-stopped
    user: redis # entrypoint cannot drop privileges itself once capabilities are dropped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *hardening

  worker:
    image: filecanopy-api:dev
    profiles: [workers]
    restart: unless-stopped
    command: ["python", "-m", "workers.heartbeat"]
    environment:
      FILECANOPY_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    <<: *hardening

volumes:
  pgdata:
  # Holds only the converter's Unix socket; mounted by the API and the converter and nothing else.
  converter-socket:
  # Holds only the OCR container's Unix socket; mounted by the API and the OCR container alone.
  ocr-socket:
