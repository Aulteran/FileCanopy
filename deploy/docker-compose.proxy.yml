# Join an existing reverse proxy's Docker network (M07c, ADR-018). Use this when your proxy runs
# in Docker (Nginx Proxy Manager, Traefik, Caddy, ...). Add it with a second -f:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
# FILECANOPY_PROXY_NETWORK (in deploy/.env) is the name of the proxy's network, see
# `docker network ls`. The proxy can then reach the app as  http://web:8080  (container name
# `filecanopy-web-1` also works). Also set FILECANOPY_TRUSTED_PROXIES to that network's subnet.
# Only the web service joins; the database and API stay on the private default network.
services:
  web:
    networks:
      - default
      - proxy

networks:
  proxy:
    name: ${FILECANOPY_PROXY_NETWORK:?set FILECANOPY_PROXY_NETWORK in deploy/.env to your reverse proxy's Docker network}
    external: true
