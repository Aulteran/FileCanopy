# Review artifacts only. No registry credentials, push, Git tag or GitHub Release operation.
name: release-prepare
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-images-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run check
      - run: npm run check:web
      - uses: docker/setup-buildx-action@v3
      - name: Build all five images locally from the clean selected commit
        run: node scripts/release-plan.mjs --prefix local/filecanopy-review --platform linux/amd64 --build --output "$RUNNER_TEMP/release-build.json"
      - name: Generate exact build inventories
        run: node scripts/release-evidence.mjs "$RUNNER_TEMP/release-build.json" "$RUNNER_TEMP/release-candidate"
      - name: Prepare standalone download bundle (no publication)
        run: |
          # The bundle is the deploy files themselves, copied unchanged (nothing is generated).
          b="$RUNNER_TEMP/docker-bundle"
          mkdir -p "$b/scripts"
          cp deploy/compose.yaml deploy/optional/compose.*.yaml deploy/.env.example deploy/.env.advanced.example "$b/"
          cp docs/guides/docker-install.md "$b/INSTALL.md"
          cp deploy/scripts/*.sh "$b/scripts/"
          cd "$b"
          sha256sum compose*.yaml .env.example .env.advanced.example INSTALL.md scripts/*.sh > SHA256SUMS
          tar -czf "$RUNNER_TEMP/filecanopy-docker-bundle.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-docker-review
          path: |
            ${{ runner.temp }}/docker-bundle/
            ${{ runner.temp }}/filecanopy-docker-bundle.tar.gz
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-review-evidence
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
